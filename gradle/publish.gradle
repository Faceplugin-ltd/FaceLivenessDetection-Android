// Shared Maven publishing for the FacePlugin face liveness libraries.
//
// Apply from a module, then set the artifact id and description:
//
//   ext.publishArtifactId = 'face-liveness-kit'
//   ext.publishDescription = '...'
//   apply from: "$rootDir/gradle/publish.gradle"
//
// Credentials and the signing key come from ~/.gradle/gradle.properties or the environment,
// never from this repository. See PUBLISHING.md.

def ENGINE_ARTIFACT_ID = 'face-recognition-sdk'

apply plugin: 'maven-publish'
apply plugin: 'signing'

def prop = { String name, String fallback = null ->
    findProperty(name) ?: System.getenv(name.toUpperCase().replaceAll('([a-z])([A-Z])', '$1_$2')) ?: fallback
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                if (project.plugins.hasPlugin('com.android.library')) {
                    from components.release
                    artifact tasks.named('javadocJar')
                } else if (project.hasProperty('publishArtifactFile')) {
                    artifact(project.publishArtifactFile) { extension = 'aar' }
                    artifact tasks.named('sourcesJar')
                    artifact tasks.named('javadocJar')
                }

                groupId = project.group
                artifactId = project.publishArtifactId
                version = project.version

                pom {
                    name = project.publishArtifactId
                    description = project.publishDescription
                    url = 'https://github.com/Faceplugin-ltd/Face-LivenessDetection-Android'
                    licenses {
                        license {
                            name = 'FacePlugin SDK License'
                            url = 'https://faceplugin.com/terms'
                            distribution = 'repo'
                        }
                    }
                    developers {
                        developer {
                            id = 'faceplugin'
                            name = 'FacePlugin'
                            email = 'contact@faceplugin.com'
                            organization = 'FacePlugin Ltd'
                            organizationUrl = 'https://faceplugin.com'
                        }
                    }
                    scm {
                        url = 'https://github.com/Faceplugin-ltd/Face-LivenessDetection-Android'
                        connection = 'scm:git:https://github.com/Faceplugin-ltd/Face-LivenessDetection-Android.git'
                        developerConnection = 'scm:git:ssh://git@github.com/Faceplugin-ltd/Face-LivenessDetection-Android.git'
                    }
                    // The engine is compile-only at build time, so declare it for consumers here.
                    // It is the same binary the recognition product publishes, so this points at
                    // that coordinate rather than shipping a second copy of it (see PUBLISHING.md).
                    if (project.findProperty('publishDependsOnEngine') == 'true') {
                        withXml {
                            def root = asNode()
                            def deps = root.get('dependencies')
                            deps = deps ? deps[0] : root.appendNode('dependencies')
                            def dep = deps.appendNode('dependency')
                            dep.appendNode('groupId', project.group)
                            dep.appendNode('artifactId', ENGINE_ARTIFACT_ID)
                            dep.appendNode('version', project.version)
                            dep.appendNode('scope', 'runtime')
                        }
                    }
                }
            }
        }

        repositories {
            maven {
                name = 'central'
                url = prop('centralUrl', 'https://ossrh-staging-api.central.sonatype.com/service/local/staging/deploy/maven2/')
                credentials {
                    username = prop('centralUsername', '')
                    password = prop('centralPassword', '')
                }
            }
            maven {
                // Local dry run: ./gradlew publishReleasePublicationToLocalStagingRepository
                name = 'localStaging'
                url = layout.buildDirectory.dir('staging-deploy')
            }
        }
    }

    signing {
        def key = prop('signingKey')
        def password = prop('signingPassword')
        if (key) {
            useInMemoryPgpKeys(key, password)
            sign publishing.publications.release
        } else {
            logger.lifecycle("${project.name}: no signingKey — artifacts will not be signed (Maven Central requires signatures)")
        }
    }
}
