plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

ext {
    publishArtifactId = 'face-liveness-active'
    publishDescription = 'FacePlugin active liveness for Android: a guided challenge sequence with ' +
        'a passive anti-spoofing gate, drawn over the camera and returned as a result.'
}

android {
    namespace 'com.faceplugin.faceliveness.active'
    compileSdk 34

    defaultConfig {
        minSdk 24
        consumerProguardFiles 'consumer-rules.pro'
    }

    buildTypes {
        release {
            minifyEnabled false
            consumerProguardFiles 'consumer-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

dependencies {
    api project(':face-liveness-kit')
    compileOnly files(rootProject.file('libs/facerecognitionsdk.aar'))
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-ktx:1.13.1'

    testImplementation 'junit:junit:4.13.2'
}

// Maven Central requires a javadoc jar for every artifact.
apply plugin: 'org.jetbrains.dokka'

tasks.register('javadocJar', Jar) {
    archiveClassifier.set('javadoc')
    from tasks.named('dokkaJavadoc')
}

apply from: "$rootDir/gradle/publish.gradle"
